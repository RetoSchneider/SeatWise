name: seatwise

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: seatwise
      POSTGRES_USER: seatwise
      POSTGRES_PASSWORD: seatwise
    ports:
      - "5432:5432"
    volumes:
      - seatwise-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seatwise -d seatwise"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.27.8
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    ports:
      - "1025:1025"
      - "8025:8025"
    volumes:
      - seatwise-mailpit:/data
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:8025/readyz",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

volumes:
  seatwise-postgres:
  seatwise-mailpit:
